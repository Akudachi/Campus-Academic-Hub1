<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="#0D1E3A" />
  
  <!-- Connector Stems -->
  <g stroke="#7D90A8" stroke-width="18" stroke-linecap="round">
    <!-- Top stem -->
    <line x1="256" y1="256" x2="256" y2="100" />
    <!-- Bottom-Left stem -->
    <line x1="256" y1="256" x2="120" y2="335" />
    <!-- Bottom-Right stem -->
    <line x1="256" y1="256" x2="392" y2="335" />
  </g>

  <!-- Top Node (White) -->
  <circle cx="256" cy="100" r="35" fill="#FFFFFF" />

  <!-- Bottom-Left Node (Royal Blue) -->
  <circle cx="120" cy="335" r="40" fill="#2563EB" />

  <!-- Bottom-Right Node (Sky/Azure Blue) -->
  <circle cx="392" cy="335" r="40" fill="#5B93D1" />

  <!-- Center Golden Circle -->
  <circle cx="256" cy="256" r="76" fill="#E59E27" />

  <!-- Graduation Cap (Dark Navy) -->
  <g fill="#0D1E3A">
    <!-- Mortarboard Top (Diamond) -->
    <polygon points="256,214 302,238 256,262 210,238" />
    
    <!-- Cap Skull Arch/Band underneath -->
    <path d="M228 248 v15 c0 15 56 15 56 0 v-15 c-10 6 -46 6 -56 0 Z" />

    <!-- Tassel Ribbon & Drop -->
    <path d="M288 246 v32" stroke="#0D1E3A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <circle cx="288" cy="282" r="4.5" />
  </g>
</svg>
